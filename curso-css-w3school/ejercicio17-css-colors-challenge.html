<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 17 - CSS Colors Challenge</title>

    <link rel="stylesheet" href="ejercicio17-css-colors-challenge.css">
</head>
<body>

    <!-- h1 con Tomato (nombre de color) -->
    <h1>Color Name</h1>
    
    <!-- h2 con #1e90ff (HEX) -->
    <h2>Hex Value</h2>
    
    <!-- p con rgb(60, 179, 113) (RGB) -->
    <p>RGB Value</p>

    <!-- Más ejemplos para practicar los 3 tipos -->
    <h1 class="extra">Tomato extra (nombre)</h1>
    <h2 class="extra-hex">#1e90ff extra (HEX)</h2>
    <p class="extra-rgb">rgb(60, 179, 113) extra (RGB)</p>

    <!-- Tabla resumen del challenge -->
    <table>
        <tr>
            <th>Elemento</th>
            <th>Tipo</th>
            <th>Valor usado</th>
        </tr>
        <tr>
            <td>h1</td>
            <td>Color Name</td>
            <td>Tomato</td>
        </tr>
        <tr>
            <td>h2</td>
            <td>Hex Value</td>
            <td>#1e90ff</td>
        </tr>
        <tr>
            <td>p</td>
            <td>RGB Value</td>
            <td>rgb(60, 179, 113)</td>
        </tr>
    </table>

</body>
</html>
