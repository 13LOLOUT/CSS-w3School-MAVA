<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 26 - CSS Border Color</title>

    <link rel="stylesheet" href="ejercicio26-css-border-color.css">
</head>
<body>

    <h1>CSS Border Color</h1>

    <!-- Ejemplos del curso -->
    <p class="one">Red border</p>
    <p class="two">Green border</p>
    <p class="three">Blue border</p>

    <!-- Lados específicos -->
    <h2>Specific Side Colors</h2>
    <p class="sides">red green blue yellow (top right bottom left)</p>

    <!-- HEX, RGB, HSL -->
    <h2>Diferentes formatos</h2>
    <p class="hex">HEX: #ff0000</p>
    <p class="rgb">RGB: rgb(255, 0, 0)</p>
    <p class="hsl">HSL: hsl(0, 100%, 50%)</p>

</body>
</html>
