<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 28 - CSS Border Shorthand</title>

    <link rel="stylesheet" href="ejercicio28-css-border-shorthand.css">
</head>
<body>

    <h1>CSS Border Shorthand</h1>

    <!-- Ejemplo básico del curso -->
    <p class="all-sides">Some text (border: 5px solid red)</p>

    <!-- Borde izquierdo -->
    <h2>Left Border</h2>
    <p class="left-border">Some text (border-left: 6px solid red)</p>

    <!-- Borde inferior -->
    <h2>Bottom Border</h2>
    <p class="bottom-border">Some text (border-bottom: 6px solid red)</p>

</body>
</html>
